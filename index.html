    <!--
      Syne → display headings · Outfit → body · JetBrains Mono → code accents.
      Loaded non-blocking: the stylesheet is fetched as "print" and switched to
      "all" on load, so first paint doesn't wait on Google Fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
